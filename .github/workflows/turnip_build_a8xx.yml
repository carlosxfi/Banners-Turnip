name: Build Turnip A830 Linux (Experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      VARIANT: a8xx
      EXTRA_PATCH: patches/a8xx_gen8.patch
      EXTRA_SCRIPT: patches/a8xx_shared_mem.py:patches/tune_a830.py
      ZIP_NAME: Turnip-A830-Tuned-Linux-${{ github.run_number }}.zip
      META_NAME: Turnip A830 Tuned Linux build ${{ github.run_number }}
      PACKAGE_VERSION: "${{ github.run_number }}"
      META_DESC: Experimental A830 Linux glibc driver with the Gen8 stack, A8xx hang fixes, shared-memory adjustments, and texture-prefetch workaround.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f build_turnip_linux.sh
          test -f mesa_hash.txt
          test -f patches/a8xx_gen8.patch
          test -f patches/a8xx_shared_mem.py
          test -f patches/tune_a830.py
          test -f .github/scripts/verify_driver_zip.py

      - name: Select pinned Mesa source
        shell: bash
        run: |
          set -euo pipefail
          MESA_COMMIT="$(tr -d '[:space:]' < mesa_hash.txt)"
          if [[ ! "$MESA_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::mesa_hash.txt must contain a full Mesa commit hash"
            exit 1
          fi
          echo "MESA_COMMIT=$MESA_COMMIT" >> "$GITHUB_ENV"
          echo "Building Mesa commit: $MESA_COMMIT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ git \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            ninja-build cmake pkg-config \
            flex bison glslang-tools \
            curl unzip zip patch \
            tar zstd xz-utils \
            libexpat1-dev python3-pip
          pip3 install --break-system-packages \
            'meson>=1.5' mako pyyaml packaging

      - name: Build Linux ARM64 driver
        shell: bash
        run: |
          set -euo pipefail
          bash build_turnip_linux.sh

      - name: Verify Linux driver package
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_driver_zip.py \
            --kind linux \
            --zip "linux_workdir/$ZIP_NAME" \
            --variant "$VARIANT" \
            --expect-name "$META_NAME" \
            --expect-package-version "$PACKAGE_VERSION" \
            --build-report linux_workdir/build-report.json \
            --report linux_workdir/verification-report.json \
            --readelf aarch64-linux-gnu-readelf

      - name: Upload Linux driver
        uses: actions/upload-artifact@v4
        with:
          name: A830-Tuned-Linux
          path: linux_workdir/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A830-Linux-Build-Reports
          path: |
            linux_workdir/build-report.json
            linux_workdir/verification-report.json
            linux_workdir/mesa/build-linux/meson-logs/meson-log.txt
          if-no-files-found: ignore
          retention-days: 14
